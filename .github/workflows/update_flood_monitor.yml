name: Update Mathews County Flood Monitor

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths-ignore:
      - 'latest_status.json'
      - 'forecast_48h.csv'
      - 'realtime_recent_observations.csv'
      - 'archive_hourly_observations.csv'
      - 'flood_dashboard.html'
      - 'index.html'
      - 'about.html'
      - 'guide.html'
      - 'data.html'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Real-Time Ingestion Pipeline
        run: |
          python3 ingest_realtime.py

      - name: Generate Multi-Page Portal & Interactive Maps
        run: |
          python3 generate_dashboard.py

      - name: Commit and push updated observations & portal pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_status.json forecast_48h.csv realtime_recent_observations.csv archive_hourly_observations.csv flood_dashboard.html index.html about.html guide.html data.html
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping git commit."
          else
            git commit -m "Automated flood data & portal update [skip ci]"
            git push
          fi

      - name: Prepare GitHub Pages site directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp flood_dashboard.html _site/
          cp about.html _site/
          cp guide.html _site/
          cp data.html _site/
          cp latest_status.json _site/
          cp forecast_48h.csv _site/
          cp realtime_recent_observations.csv _site/
          cp archive_hourly_observations.csv _site/
          cp ground_truth_observations.csv _site/
          mkdir -p _site/photos
          cp photos/*.jpeg _site/photos/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
