name: Update Mathews County Flood Monitor

on:
  schedule:
    # Avoid top-of-hour contention. GitHub's schedule is best effort.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '*.html'
      - 'latest_status.json'
      - '*observations.csv'
      - 'forecast_48h.csv'
      - 'alert_state.json'

permissions:
  contents: read

concurrency:
  group: flood-pipeline
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      artifact_ready: ${{ steps.upload.outcome == 'success' }}
    env:
      # Status metadata must match the unconditional --ntfy dispatch below.
      NTFY_ALERTS_ENABLED: 'true'
      NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'mathews-flood-23128' }}
      NODE_OPTIONS: '--no-deprecation'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/api
          key: flood-api-${{ github.run_id }}
          restore-keys: flood-api-
      - name: Regression checks
        run: python3 -m unittest discover -s tests -v
      - name: Fetch timestamped observations and forecasts
        run: python3 ingest_realtime.py
      - name: Generate portal
        run: python3 generate_dashboard.py
      - name: Dispatch existing community alerts
        id: alerts
        # Still publish fresh/degraded portal data if notification service fails.
        continue-on-error: true
        run: python3 check_alerts.py --ntfy
      - name: Save data, pages, and successfully dispatched alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_status.json forecast_48h.csv realtime_recent_observations.csv archive_hourly_observations.csv flood_dashboard.html index.html alerts.html subscribe.html about.html guide.html data.html science.html alert_state.json issued_forecast_archive.csv models/live_verification.json
          if ! git diff --staged --quiet; then
            git commit -m "Automated flood data and portal update [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare Pages site
        run: python3 publish_site.py
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: Surface notification failure
        if: steps.alerts.outcome == 'failure'
        run: |
          echo 'Required alert delivery/configuration failed. Portal artifact was still prepared.'
          exit 1
  deploy:
    if: ${{ !cancelled() && needs.update.outputs.artifact_ready == 'true' }}
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NODE_OPTIONS: '--no-deprecation'
    steps:
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
